[package]
name = "agfs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run commands in a sandboxed overlay filesystem"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
nix = { version = "0.29", features = ["mount", "fs", "sched", "process", "user", "signal"] }
tempfile = "3"
walkdir = "2"
