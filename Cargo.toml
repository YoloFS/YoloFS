[package]
name = "yolofs"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0"

[[bin]]
name = "yolo"
path = "user/main.rs"

[lib]
path = "user/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "mount", "process", "signal", "term", "ioctl", "user"] }
anyhow = "1"
colored = "2"
libc = "0.2"
similar = "2"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
