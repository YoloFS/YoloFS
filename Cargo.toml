[package]
name = "agfs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agfs"
path = "cli/main.rs"

[[bin]]
name = "agfs-bench"
path = "bench/src/main.rs"

[lib]
path = "cli/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "mount", "sched", "process", "signal", "term", "ioctl", "poll", "dir", "user", "hostname"] }
anyhow = "1"
colored = "2"
libc = "0.2"
similar = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plotly = "0.14"
dirs-next = "2"
inferno = "0.12"

[dev-dependencies]

[dependencies.tempfile]
version = "3"
