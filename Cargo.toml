[package]
name = "agfs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run commands in a sandboxed overlay filesystem"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
nix = { version = "0.29", features = ["mount", "fs", "sched", "process", "user", "signal"] }
rmcp = { version = "1.1.0", features = ["elicitation", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
shlex = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt"] }
walkdir = "2"
