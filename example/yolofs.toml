# yolofs.toml — yolofs configuration for this directory.
#
# This file is the built-in default: `yolo init` writes a copy of it, and a
# `yolo mount` with no yolofs.toml falls back to these settings. Edit freely.
# See docs/cli.md and docs/permissions.md for the full reference.

permission = true      # gate filesystem access through the [rules] below
staging = true         # stage writes for review instead of applying directly
auto_snapshot = true   # snapshot after each `yolo exec` (per-command checkpoints)
prompt_timeout = 30    # seconds to wait for an `ask` answer before denying

[rules]
# System locations: read-only so tools work but can't be modified.
"/usr" = "read"
"/bin" = "read"
"/sbin" = "read"
"/lib" = "read"
"/lib64" = "read"
"/etc" = "read"

# Sensitive files: prompt before any access.
"$HOME/.ssh/id_ed25519" = "ask"

# Project tree and yolofs internals. The storage dir is readable (yolofs stacks
# over /, so tools can inspect staging from inside the mount). The mountpoint
# itself lives outside the workspace under the per-user runtime dir and is hidden
# automatically to avoid recursion — no rule needed here.
"." = "allow"
".yolofs" = "read"
"yolofs.toml" = "read"

"$HOME/.bashrc" = "allow"
"$HOME/.bash_history" = "allow"
"$HOME/.cargo/env" = "allow"
"$HOME/.nvm" = "allow"
