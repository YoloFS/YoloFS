permission = true
staging = true
ask_default = "deny"
ask_timeout = 30
checkpoint = true

[rules]
"/etc" = "allow-ro"
"/usr/bin" = "allow-rx"
"/usr/lib" = "allow-rx"
"/usr/share" = "allow-ro"
"/usr/bin/git" = "ask"
"$HOME/.bash_history" = "allow-rw"
"$HOME/.ssh/id_ed25519" = "ask"
"." = "allow-rw"
".agfs" = "hide"
"agfs.toml" = "hide"