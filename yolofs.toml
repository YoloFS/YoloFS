permission = true
staging = true
ask_default = "deny"
ask_timeout = 30
checkpoint = true

[rules]
"/etc" = "ro"
"/usr/bin" = "ro"
"/usr/lib" = "ro"
"/usr/share" = "ro"
"/usr/bin/git" = "ask"
"$HOME/.bash_history" = "allow"
"$HOME/.ssh/id_ed25519" = "ask"
"." = "allow"
".yolofs" = "hidden"
"yolofs.toml" = "hidden"
