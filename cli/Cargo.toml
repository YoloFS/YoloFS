[package]
name = "agfs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agfs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "mount", "sched", "process", "ioctl", "poll", "dir", "user"] }
anyhow = "1"
colored = "2"
libc = "0.2"
similar = "2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
