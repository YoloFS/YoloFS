name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: ./install_deps.sh

      - name: Build and install
        run: make install

      - name: Lint
        run: make lint
        continue-on-error: true

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-e2e
