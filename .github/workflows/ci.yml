name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Install dependencies
        run: ./install_deps.sh

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test-unit

      - name: Load kernel module
        run: make load-kmod

      - name: Integration tests
        run: make test-integration

      - name: Unload kernel module
        if: always()
        run: make unload-kmod
