name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install dependencies
        run: ./install_deps.sh

      - name: Auto-fix lint
        run: |
          make fix
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: auto-fix lint" && git push)

      - name: Build and install
        run: make install

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-e2e

      - name: Example script
        run: ./example.sh
