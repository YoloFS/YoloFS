name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup environment
        run: ./setup.sh

      - name: Build and install
        run: make install

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-e2e

      - name: Example script
        run: ./example.sh

  chore:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config url."https://x:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Auto-fix lint
        run: |
          make fix
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-fix lint"

      - name: Update submodules
        run: |
          git config -f .gitmodules --get-regexp 'submodule\..*\.path' | while read key path; do
            name=${key#submodule.}; name=${name%.path}
            url=$(git config -f .gitmodules "submodule.$name.url")
            case "$url" in *github.com/YoloFS/*) ;; *) continue ;; esac
            sha=$(git ls-remote "$url" HEAD | cut -f1)
            if [ -z "$sha" ]; then
              echo "::error::git ls-remote failed for $url (submodule $name at $path)"
              exit 1
            fi
            git update-index --cacheinfo 160000,"$sha","$path"
          done
          git diff --cached --quiet || git commit -m "chore: update submodules"

      - name: Push changes
        run: git diff --cached --quiet || git push
