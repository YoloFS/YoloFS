name: CI

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Setup environment
        run: ./setup.sh

      - name: Build and install
        run: make install

      - name: Unit tests
        run: make test-unit

      - name: Integration tests
        run: make test-e2e

      - name: Example script
        run: ./example.sh

  chore:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-chore-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-chore-

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Auto-fix lint
        run: |
          make fix
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto-fix lint [skip ci]"

      - name: Update submodules
        run: |
          git config -f .gitmodules --get-regexp '^submodule\..*\.url$' | while read -r key url; do
            name=${key#submodule.}; name=${name%.url}
            path=$(git config -f .gitmodules "submodule.$name.path")
            if ! sha=$(git ls-remote "$url" HEAD | cut -f1); then
              echo "::error::git ls-remote failed for $url (submodule $name at $path)"
              exit 1
            fi
            if [ -z "$sha" ]; then
              echo "::error::empty sha from $url (submodule $name at $path)"
              exit 1
            fi
            echo "updating submodule $name at $path to $sha"
            git update-index --cacheinfo 160000,"$sha","$path"
          done
          git diff --cached --quiet || git commit -m "chore: update submodules [skip ci]"

      - name: Push changes
        run: git push
