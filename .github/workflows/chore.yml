name: Chore

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Auto-fix lint
        run: make fix

      - name: Update submodules
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config -f .gitmodules --get-regexp 'submodule\..*\.path' | while read key path; do
            case "$path" in */*) continue ;; esac
            name=$(echo "$key" | sed 's/^submodule\.\(.*\)\.path$/\1/')
            url=$(git config -f .gitmodules "submodule.$name.url")
            sha=$(git ls-remote "$url" HEAD | awk '{print $1}')
            if [ -n "$sha" ]; then
              git update-index --cacheinfo 160000,"$sha","$path"
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: auto-fix lint and update submodules" && git push)
